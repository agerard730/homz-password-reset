<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>HOMZ — Reset Password</title>
<style>body{margin:0;background:#f5f7fb;color:#111827;font:14px Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{box-sizing:border-box;width:min(430px,calc(100vw - 32px));background:white;border:1px solid #dce2ec;border-radius:14px;padding:32px;box-shadow:0 12px 35px #0f172a16}h1{font-size:23px;margin:0 0 8px}p{color:#667085;line-height:1.5}label{display:block;margin:15px 0 6px;font-weight:bold;font-size:12px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}button{width:100%;background:#111827;color:#fff;border:0;border-radius:8px;padding:13px;margin-top:20px;cursor:pointer}button:disabled{opacity:.6}#message{margin-top:15px;color:#667085;min-height:20px}#message.error{color:#b42318}#message.success{color:#067647}[hidden]{display:none!important}</style>
</head><body><main class="card"><h1>HOMZ Call Monitor</h1><p>Set a new password for your account.</p><form id="form" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="submit" type="submit">Update password</button></form><p id="message" role="status" aria-live="polite">Checking password-reset link…</p></main>
<script>
'use strict';
// Public Supabase project configuration only; NEVER put secret/service_role keys here.
const BASE='https://bhtqxgngdmfuhagbmggp.supabase.co';
const KEY='sb_publishable_j79dLjHIeY7ZPO0FcIIdoQ_DhUNcclW';
const form=document.getElementById('form'), msg=document.getElementById('message');
const status=(value,kind='')=>{msg.textContent=value;msg.className=kind;};
const fragment=new URLSearchParams(location.hash.slice(1));
const query=new URLSearchParams(location.search);
const access=fragment.get('access_token');
const type=fragment.get('type');
// Clear tokens from the address bar immediately to reduce accidental disclosure.
history.replaceState(null,'',location.pathname);
async function api(route,method='GET',payload){
  const response=await fetch(BASE+route,{method,headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},...(payload?{body:JSON.stringify(payload)}:{})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(data.msg||data.message||data.error_description||'Request failed');
  return data;
}
(async()=>{
  const error=query.get('error_description')||fragment.get('error_description');
  if(error){status('This link could not be used: '+error,'error');return;}
  if(!access||type!=='recovery'){status('Invalid or expired reset link. Request a new link from HOMZ Call Monitor.','error');return;}
  try{await api('/auth/v1/user');form.hidden=false;status('Enter and confirm your new password.');}
  catch(e){status('This reset link is no longer valid. Request another link.','error');}
})();
form.addEventListener('submit',async e=>{
  e.preventDefault();const password=document.getElementById('password').value;
  if(password.length<8){status('Password must be at least 8 characters.','error');return;}
  if(password!==document.getElementById('confirm').value){status('Passwords do not match.','error');return;}
  const button=document.getElementById('submit');button.disabled=true;status('Updating password…');
  try{await api('/auth/v1/user','PUT',{password});form.hidden=true;status('Password updated. Return to HOMZ Call Monitor and sign in with your new password.','success');}
  catch(e){status('Unable to update password: '+e.message,'error');}
  finally{button.disabled=false;}
});
</script></body></html>
